appId: app.kiki.desktop
productName: Kiki
# Kiki-0.2.0-x86_64.AppImage, Kiki-0.2.0-x86_64.rpm, Kiki-0.2.0-amd64.deb
artifactName: ${productName}-${version}-${arch}.${ext}
# `--publish always` (the release workflow) uploads to a draft GitHub Release for the tag.
publish:
  provider: github
  owner: self-controller
  repo: kiki_assistant
  releaseType: draft
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/icon.png
  - resources/trayTemplate*.png
  - package.json
extraResources:
  - from: resources/kiki_context.py
    to: kiki_context.py
  - from: resources/gnome-extension
    to: gnome-extension
    filter: ["**/*", "!**/*.d.ts"]
linux:
  target: [AppImage, rpm, deb]
  executableName: kiki
  # The deb needs a maintainer; GitHub's no-reply address keeps a personal one out of the package.
  maintainer: Kiki <self-controller@users.noreply.github.com>
  category: Utility
  icon: resources/icon.png
  synopsis: Highlight text anywhere and ask Kiki about it
rpm:
  depends: [wl-clipboard, python3-gobject, at-spi2-core]
deb:
  depends: [wl-clipboard, python3-gi, gir1.2-atspi-2.0]
mac:
  target: dmg
  category: public.app-category.productivity
  icon: resources/icon.png
  extendInfo:
    LSUIElement: true
    NSAppleEventsUsageDescription: Kiki reads the selected text and window title from the app you're using.
