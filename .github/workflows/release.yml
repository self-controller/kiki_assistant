# Builds Kiki's Linux packages (AppImage, rpm, deb).
# - Push a tag like v0.2.0 (it must match desktop/package.json's version): the packages go to a draft GitHub
#   Release for that tag, which you check and publish.
# - Run it by hand (Actions › Release › Run workflow): the packages are attached to the run, with no release.
# The Google connectors need the repository secrets GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (your Google
# Cloud "Desktop app" OAuth client); without them the build works and Kiki offers no Google sign-in.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner, so the AppImage runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install rpm tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      - name: Check that the tag matches the app's version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match desktop/package.json version ${version}." >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      - name: Build the packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run dist:linux -w desktop -- --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}

      - name: Attach the packages to the run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: kiki-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.rpm
            desktop/release/*.deb
